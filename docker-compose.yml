version: '3.8'

services:
  happy-home-app:
    build:
      context: .
      args:
        VITE_APP_STORE_URL: ${VITE_APP_STORE_URL:-}
        VITE_PLAY_STORE_URL: ${VITE_PLAY_STORE_URL:-}
    container_name: happy-home-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/albait.db
    volumes:
      - /mnt/ssd/projects/happyhome/happypublic/data:/app/data/
    restart: always
